name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per OS: the code has Unix-only and Windows-only branches (process restart, profile
  # directory, Steam library lookup), so each platform must compile and pass its own tests.
  # No job needs the retail game: tests that read it skip when it is absent
  # (`GUNZ_GAME` unset, `.local/extract` missing), so only the pure parsers and logic run here.
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries (audio, udev, windowing)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # Formatting does not depend on the platform: check it once.
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo build --release --locked --all-targets
      - run: cargo test --release --locked
