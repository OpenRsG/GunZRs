name: Release

# A `v*` tag builds the downloads and publishes them as a GitHub release; a manual run only
# builds them (workflow artifacts), to try the packaging.
on:
 push:
  tags: ["v*"]
 workflow_dispatch:

permissions:
 contents: write

env:
 CARGO_TERM_COLOR: always

jobs:
 linux:
  # glibc 2.35: the binaries run on Ubuntu 22.04 and later, Arch and other current distributions.
  runs-on: ubuntu-22.04
  steps:
   - uses: actions/checkout@v4
   - name: Linux system libraries (audio, udev, windowing)
     run: |
      sudo apt-get update
      sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
   - uses: dtolnay/rust-toolchain@stable
   - uses: Swatinem/rust-cache@v2
   - run: cargo install cargo-deb --locked
   - name: Debian/Ubuntu package (builds the binaries)
     run: cargo deb --locked --profile dist --output dist/
   - name: Portable tarball
     run: |
      name="gunzrs-${GITHUB_REF_NAME}-linux-x86_64"
      mkdir "$name"
      cp target/dist/gunz-play target/dist/gunz start.sh install.sh packaging/gunzrs.desktop \
         README.md LICENSE assets/fonts/OFL-*.txt "$name/"
      tar czf "dist/$name.tar.gz" "$name"
   - uses: actions/upload-artifact@v4
     with:
      name: linux
      path: dist/*

 windows:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: dtolnay/rust-toolchain@stable
   - uses: Swatinem/rust-cache@v2
   - run: cargo build --locked --profile dist --bin gunz-play --bin gunz
   - name: Zip
     shell: pwsh
     run: |
      $name = "gunzrs-$env:GITHUB_REF_NAME-windows-x86_64"
      New-Item -ItemType Directory $name, dist | Out-Null
      Copy-Item target/dist/gunz-play.exe, target/dist/gunz.exe, packaging/start.bat, README.md, LICENSE, assets/fonts/OFL-*.txt $name
      Compress-Archive $name "dist/$name.zip"
   - uses: actions/upload-artifact@v4
     with:
      name: windows
      path: dist/*

 publish:
  if: startsWith(github.ref, 'refs/tags/')
  needs: [linux, windows]
  runs-on: ubuntu-latest
  steps:
   - uses: actions/download-artifact@v4
     with:
      path: dist
      merge-multiple: true
   - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "GunZRs $GITHUB_REF_NAME" --generate-notes
     env:
      GH_TOKEN: ${{ github.token }}
