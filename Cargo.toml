[package]
name = "gunz"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Clean-room Rust port of GunZ: The Duel that plays the Steam game's own files"
repository = "https://github.com/OpenRsG/GunZRs"
publish = false
default-run = "gunz"

[dependencies]
# `debug` keeps type names: `phase::end_match` tells the game's resources from Bevy's by name
bevy = { version = "0.19", features = ["debug", "dds", "bmp", "tga", "jpeg", "wav", "mp3"] }
flate2 = "1"
roxmltree = "0.21"

# Browser build (`web/build.sh`): WebGPU rendering, page URL and packs from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", features = ["webgpu", "web"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The browser build: one codegen unit with fat LTO (smaller and faster wasm), no unwinding.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Release downloads (`.github/workflows/release.yml`): thin LTO, no symbols.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

# `cargo deb --profile dist` (Ubuntu/Debian package): `start.sh` becomes the `gunzrs` command.
[package.metadata.deb]
name = "gunzrs"
maintainer = "OpenRsG <339018222+OpenRsG@users.noreply.github.com>"
section = "games"
# Vulkan and xkbcommon are loaded at run time, so `$auto` cannot see them.
depends = "$auto, libvulkan1, libxkbcommon0"
extended-description = "Needs your own copy of GunZ: The Duel from Steam; the game files are read from its install."
assets = [
    ["target/release/gunz-play", "usr/bin/", "755"],
    ["target/release/gunz", "usr/bin/", "755"],
    ["start.sh", "usr/bin/gunzrs", "755"],
    ["packaging/gunzrs.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/gunzrs/", "644"],
    ["assets/fonts/OFL-*.txt", "usr/share/doc/gunzrs/", "644"],
]
