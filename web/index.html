<!doctype html>
<html lang="en">

<head>
 <meta charset="utf-8">
 <meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
 <title>GunZRs</title>
 <link rel="modulepreload" href="pkg/gunz-play.js">
 <style>
  html,
  body {
   margin: 0;
   height: 100%;
   background: #0b0c10;
   color: #ddd;
   font: 15px system-ui, sans-serif;
   overflow: hidden
  }

  #game {
   position: fixed;
   inset: 0
  }

  canvas {
   width: 100%;
   height: 100%;
   display: block;
   outline: none
  }

  .screen {
   position: fixed;
   inset: 0;
   display: grid;
   place-items: center;
   background: #0b0c10
  }

  .box {
   background: #15171d;
   border: 1px solid #333;
   padding: 24px 28px;
   width: min(520px, 90vw);
   border-radius: 6px;
   box-sizing: border-box
  }

  h1 {
   margin: 0 0 16px;
   font-size: 26px;
   letter-spacing: 2px;
   color: #e8c46a
  }

  label {
   display: grid;
   grid-template-columns: 110px 1fr;
   align-items: center;
   margin: 8px 0
  }

  select,
  input {
   background: #0f1115;
   color: #ddd;
   border: 1px solid #444;
   padding: 5px;
   border-radius: 3px
  }

  button {
   margin-top: 14px;
   width: 100%;
   padding: 10px;
   font-size: 17px;
   background: #e8c46a;
   color: #111;
   border: 0;
   border-radius: 4px;
   cursor: pointer
  }

  button:disabled {
   opacity: .5;
   cursor: default
  }

  .note {
   margin-top: 10px;
   font-size: 13px;
   color: #999;
   min-height: 1.2em
  }

  .err {
   color: #f77 !important
  }

  #loading {
   display: none
  }

  .item {
   margin: 10px 0
  }

  .row {
   display: flex;
   justify-content: space-between;
   font-size: 13px;
   color: #aaa;
   margin-bottom: 4px
  }

  .row b {
   color: #ddd;
   font-weight: 500
  }

  .item.active b {
   color: #e8c46a
  }

  .item.done .row span::after {
   content: " \2713";
   color: #8c8
  }

  .bar {
   height: 6px;
   background: #2a2c33;
   border-radius: 3px;
   overflow: hidden;
   position: relative
  }

  .bar i {
   display: block;
   height: 100%;
   width: 0;
   background: #e8c46a;
   transition: width .15s
  }

  .item.done .bar i {
   background: #8c8
  }

  /* an endless stripe for steps without a byte count; transform keeps it moving on the
     compositor while the game's start-up blocks the page */
  .busy i {
   width: 30% !important;
   animation: slide 1.1s linear infinite
  }

  @keyframes slide {
   from {
    transform: translateX(-100%)
   }

   to {
    transform: translateX(340%)
   }
  }

  #total {
   height: 10px;
   margin-top: 18px
  }

  #now {
   margin-top: 10px;
   font-size: 14px;
   color: #ddd;
   min-height: 1.3em
  }

  /* touch controls: a floating stick on the left 40%, look by dragging anywhere else (the
     fire button too), buttons around the right thumb */
  #touch {
   position: fixed;
   inset: 0;
   touch-action: none;
   user-select: none;
   -webkit-user-select: none;
   -webkit-touch-callout: none
  }

  #touch.off {
   pointer-events: none
  }

  #touch.off>* {
   display: none
  }

  .ctl {
   position: absolute;
   width: 60px;
   height: 60px;
   margin: 0;
   padding: 0;
   border-radius: 50%;
   background: rgba(255, 255, 255, .13);
   border: 2px solid rgba(255, 255, 255, .35);
   color: #fff;
   font: 600 12px system-ui, sans-serif;
   letter-spacing: .5px;
   cursor: default
  }

  .ctl.on {
   background: rgba(232, 196, 106, .5)
  }

  #fire {
   width: 96px;
   height: 96px;
   font-size: 15px;
   right: calc(24px + env(safe-area-inset-right));
   bottom: 28px
  }

  #jump {
   width: 70px;
   height: 70px;
   right: calc(134px + env(safe-area-inset-right));
   bottom: 18px
  }

  #dash {
   right: calc(132px + env(safe-area-inset-right));
   bottom: 104px
  }

  #guard {
   right: calc(62px + env(safe-area-inset-right));
   bottom: 140px
  }

  #reload,
  #swap {
   width: 50px;
   height: 50px;
   font-size: 10px
  }

  #reload {
   right: calc(10px + env(safe-area-inset-right));
   bottom: 150px
  }

  #swap {
   right: calc(216px + env(safe-area-inset-right));
   bottom: 22px
  }

  #scores,
  #pause {
   width: 44px;
   height: 44px;
   top: 8px;
   border-radius: 8px;
   font-size: 16px
  }

  #pause {
   right: calc(62px + env(safe-area-inset-right))
  }

  #scores {
   right: calc(114px + env(safe-area-inset-right))
  }

  #stick {
   position: absolute;
   width: 130px;
   height: 130px;
   margin: -65px 0 0 -65px;
   border-radius: 50%;
   background: rgba(255, 255, 255, .08);
   border: 2px solid rgba(255, 255, 255, .3);
   pointer-events: none;
   visibility: hidden
  }

  #stick i {
   position: absolute;
   left: 38px;
   top: 38px;
   width: 54px;
   height: 54px;
   border-radius: 50%;
   background: rgba(255, 255, 255, .45)
  }

  /* above the touch layer and the loading screen, on every device */
  #fs {
   position: fixed;
   z-index: 2;
   top: 8px;
   right: calc(8px + env(safe-area-inset-right));
   width: 44px;
   height: 44px;
   margin: 0;
   padding: 0;
   font-size: 22px;
   line-height: 1;
   background: rgba(0, 0, 0, .35);
   color: #fff;
   border: 2px solid rgba(255, 255, 255, .35);
   border-radius: 8px
  }

  button.alt {
   margin-top: 8px;
   background: #2a2c33;
   color: #e8c46a;
   border: 1px solid #e8c46a
  }
 </style>
</head>

<body>
 <div id="game"><canvas id="gunz" tabindex="0"></canvas></div>
 <div id="menu" class="screen">
  <div class="box">
   <h1>GUNZRS</h1>
   <label>Map <select id="map"></select></label>
   <label>Mode <select id="mode">
     <option value="dm">Deathmatch</option>
     <option value="tdm">Team deathmatch</option>
     <option value="gladiator">Gladiator</option>
     <option value="team-gladiator">Team gladiator</option>
     <option value="elimination">Elimination</option>
     <option value="assassinate">Assassinate</option>
     <option value="duel">Duel</option>
     <option value="berserker">Berserker</option>
    </select></label>
   <label>Bots <input id="bots" type="number" min="0" max="15" value="3"></label>
   <button id="start" disabled>START</button>
   <button id="dress" class="alt" disabled>CHARACTER &amp; CLOTHES</button>
   <div class="note" id="note">Checking WebGPU...</div>
  </div>
 </div>
 <div id="loading" class="screen">
  <div class="box">
   <h1>LOADING</h1>
   <div id="items"></div>
   <div class="bar" id="total"><i></i></div>
   <div id="now"></div>
  </div>
 </div>
 <div id="touch" class="off">
  <div id="stick"><i></i></div>
  <button class="ctl" id="fire" data-k="7" data-look>FIRE</button>
  <button class="ctl" id="jump" data-k="6">JUMP</button>
  <button class="ctl" id="dash" data-k="13" data-tap>DASH</button>
  <button class="ctl" id="guard" data-k="8">GUARD</button>
  <button class="ctl" id="reload" data-k="9">RELOAD</button>
  <button class="ctl" id="swap" data-k="12" data-tap>SWAP</button>
  <button class="ctl" id="scores" data-k="10">&#9776;</button>
  <button class="ctl" id="pause" data-k="11">II</button>
 </div>
 <button id="fs" title="Fullscreen">&#x26F6;</button>
 <script type="module">
  const $ = id => document.getElementById(id);
  const note = (t, err) => {$("note").textContent = t; $("note").classList.toggle("err", !!err);};
  const mb = n => (n / 1048576).toFixed(1);
  const saved = JSON.parse(sessionStorage.getItem("gunz") || "null");

  // Fullscreen (landscape on a phone); a touch screen also goes fullscreen on START.
  async function fullscreen(on) {
   if (on && !document.fullscreenElement) {
    await document.documentElement.requestFullscreen?.({navigationUI: "hide"}).catch(() => { });
    await screen.orientation?.lock?.("landscape").catch(() => { });
   } else if (!on && document.fullscreenElement) await document.exitFullscreen();
  }
  $("fs").onclick = () => {fullscreen(!document.fullscreenElement); $("gunz").focus();};
  if (!document.documentElement.requestFullscreen) $("fs").remove();

  // Touch controls, only with a touch screen as the main pointer (or `?touch` to try them).
  // They write `gunzTouch`; the game reads it once per frame (`src/web.rs` `touch` has the
  // layout): [0..2] look drag, [2..12] held stick W A S D, jump, fire, guard, reload, scores,
  // pause (3 = pressed, 2 = released before the game saw it), [12] next weapon, [13] dash.
  const touch = matchMedia("(pointer: coarse)").matches || new URLSearchParams(location.search).has("touch");
  if (touch) {
   const T = globalThis.gunzTouch = new Float32Array(14);
   const LOOK = 2.2;  // look speed: mouse counts per dragged CSS pixel (times the game's sensitivity)
   const DEAD = 0.35; // stick dead zone, fraction of its radius
   const R = 52;      // stick travel in CSS pixels
   const layer = $("touch"), stick = $("stick"), knob = stick.firstElementChild;
   const fingers = new Map();
   const press = k => T[k] = 3;
   const release = k => T[k] = T[k] === 3 ? 2 : 0;
   const steer = (dx, dy) => {
    const d = Math.hypot(dx, dy), s = d > R ? R / d : 1;
    knob.style.transform = `translate(${dx * s}px, ${dy * s}px)`;
    const x = dx / R, y = dy / R;
    T[2] = y < -DEAD ? 1 : 0; T[4] = y > DEAD ? 1 : 0; // W S
    T[3] = x < -DEAD ? 1 : 0; T[5] = x > DEAD ? 1 : 0; // A D
   };
   layer.addEventListener("pointerdown", e => {
    e.preventDefault();
    const b = e.target.closest("[data-k]"), f = {x: e.clientX, y: e.clientY, b};
    if (b) {
     b.classList.add("on");
     if ("tap" in b.dataset) T[+b.dataset.k] = 1; else press(+b.dataset.k);
    } else if (e.clientX < innerWidth * 0.4 && ![...fingers.values()].some(f => f.stick)) {
     f.stick = true;
     Object.assign(stick.style, {left: `${e.clientX}px`, top: `${e.clientY}px`, visibility: "visible"});
     steer(0, 0);
    }
    fingers.set(e.pointerId, f);
   });
   layer.addEventListener("pointermove", e => {
    const f = fingers.get(e.pointerId);
    if (!f) return;
    if (f.stick) {steer(e.clientX - f.x, e.clientY - f.y); return;}
    if (f.b && !("look" in f.b.dataset)) return;
    T[0] += (e.clientX - f.x) * LOOK; T[1] += (e.clientY - f.y) * LOOK;
    f.x = e.clientX; f.y = e.clientY;
   });
   const lift = e => {
    const f = fingers.get(e.pointerId);
    if (!f) return;
    fingers.delete(e.pointerId);
    if (f.stick) {T[2] = T[3] = T[4] = T[5] = 0; stick.style.visibility = "hidden";}
    if (f.b) {f.b.classList.remove("on"); if (!("tap" in f.b.dataset)) release(+f.b.dataset.k);}
   };
   layer.addEventListener("pointerup", lift);
   layer.addEventListener("pointercancel", lift);
   layer.addEventListener("contextmenu", e => e.preventDefault());
   // the game paused or ended: hand taps to its menus, let go of everything
   globalThis.gunzPaused = paused => {
    layer.classList.toggle("off", paused);
    if (paused) {for (const id of [...fingers.keys()]) lift({pointerId: id}); T.fill(0);}
   };
  }

  if (!navigator.gpu || !(await navigator.gpu.requestAdapter().catch(() => null))) {
   note("This browser has no WebGPU (try a current Chrome, Edge or Firefox; on Linux enable it in the browser's flags). The page must be opened over HTTPS or localhost.", true);
   throw new Error("no WebGPU");
  }

  // One line of the loading screen: name, size, its own bar. Every download starts on page load
  // (in the background while the menu is up) and reports here; the screen shows once START is hit.
  class Item {
   constructor(label, bytes) {
    this.label = label; this.total = bytes || 0; this.got = 0; this.started = 0;
    this.el = document.createElement("div");
    this.el.className = "item";
    this.el.innerHTML = `<div class="row"><b></b><span></span></div><div class="bar"><i></i></div>`;
    this.el.querySelector("b").textContent = label;
    $("items").append(this.el);
    this.paint();
   }
   bytes(n) {this.started ||= performance.now(); this.got += n; this.paint(); refresh(this);}
   busy(text) {this.text = text; this.el.querySelector(".bar").classList.add("busy"); this.paint(); refresh(this);}
   done() {
    this.got = this.total; this.el.classList.add("done"); this.el.classList.remove("active");
    this.el.querySelector(".bar").classList.remove("busy"); this.text = null; this.paint(); refresh();
   }
   paint() {
    const f = this.total ? Math.min(1, this.got / this.total) : 0;
    this.el.querySelector("i").style.width = `${f * 100}%`;
    // a step without bytes is described in the status line below the bars
    this.el.querySelector("span").textContent = this.total ? `${mb(this.got)} / ${mb(this.total)} MB` : "";
   }
  }
  const items = [];
  function refresh(current) {
   const total = items.reduce((s, i) => s + i.total, 0), got = items.reduce((s, i) => s + Math.min(i.got, i.total), 0);
   $("total").querySelector("i").style.width = `${total ? got / total * 100 : 0}%`;
   if (!current) return;
   for (const i of items) i.el.classList.toggle("active", i === current);
   const secs = (performance.now() - current.started) / 1000;
   const rate = secs > 0.3 ? current.got / secs : 0;
   $("now").textContent = current.text ? `${current.label}: ${current.text}`
    : `Downloading ${current.label}` + (rate ? ` at ${mb(rate)} MB/s, ${Math.max(0, (current.total - current.got) / rate).toFixed(0)} s left` : "...");
  }
  function item(label, bytes) {const i = new Item(label, bytes); items.push(i); return i;}

  // Streams `url` into `item`: `inflate` for a gzip pack (counted as downloaded, unpacked here).
  async function download(url, it, inflate) {
   const r = await fetch(url);
   if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
   it.total ||= +r.headers.get("X-Raw-Length") || +r.headers.get("Content-Length") || 0;
   let body = r.body.pipeThrough(new TransformStream({transform(c, out) {it.bytes(c.byteLength); out.enqueue(c);} }));
   if (inflate) body = body.pipeThrough(new DecompressionStream("gzip"));
   return new Response(body, {headers: {"Content-Type": r.headers.get("Content-Type") || ""}});
  }
  const pack = (entry, it) => download(`data/${entry.file}?v=${entry.crc}`, it, true)
   .then(r => r.arrayBuffer()).then(b => {it.done(); return new Uint8Array(b);});

  let index;
  try {
   const r = await fetch("data/index.json", {cache: "no-cache"});
   if (!r.ok) throw new Error("data/index.json is missing: run web/build.sh");
   index = await r.json();
  } catch (e) {note(e.message, true); throw e;}
  for (const m of index.maps) $("map").add(new Option(m.name.replace(/\b\w/g, c => c.toUpperCase()), m.name));
  if (saved) for (const k of ["map", "mode", "bots"]) $(k).value = saved[k];
  else $("map").value = index.maps.some(m => m.name === "mansion") ? "mansion" : index.maps[0].name;

  // Files the packs leave out (`files/`: every clothing piece and its textures) are read by the
  // game one at a time, synchronously (`src/web.rs` `fetch`): `null` if the download fails.
  globalThis.gunzFetch = path => {
   const x = new XMLHttpRequest();
   x.open("GET", "data/files/" + path.split("/").map(encodeURIComponent).join("/"), false);
   x.overrideMimeType("text/plain; charset=x-user-defined");
   try {x.send();} catch {return null;}
   if (x.status !== 200) return null;
   const s = x.responseText, b = new Uint8Array(s.length);
   for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xff;
   return b;
  };

  // The engine compiles while it downloads; the shared pack starts at once as well.
  const engineItem = item("Game engine", 0);
  const engine = Promise.all([
   import("./pkg/gunz-play.js"),
   download("pkg/gunz-play_bg.wasm", engineItem).then(r => WebAssembly.compileStreaming(r)),
  ]).then(x => {engineItem.done(); return x;});
  const coreItem = item("Characters, weapons, effects and sounds", index.core.bytes);
  const core = pack(index.core, coreItem);
  Promise.all([engine, core]).then(() => note("Ready."), e => note(e.message, true));
  note("Downloading the game in the background...");
  $("start").disabled = $("dress").disabled = false;

  // Runs the engine once per page: a match (`map` set: its pack is downloaded too) or the
  // game's own menu on its character page. The page reloads when either ends.
  async function launch(args, map) {
   $("start").disabled = $("dress").disabled = true;
   if (touch && map) fullscreen(true);
   $("menu").style.display = "none";
   $("loading").style.display = "grid";
   const entry = map && index.maps.find(m => m.name === map);
   const mapItem = entry && item(`Map: ${entry.name.replace(/\b\w/g, c => c.toUpperCase())}`, entry.bytes);
   const startItem = item(map ? "Starting the match" : "Opening the character screen", 0);
   refresh(items.find(i => !i.el.classList.contains("done")));
   try {
    const [[mod, wasm], c, m] = await Promise.all([engine, core, entry ? pack(entry, mapItem) : null]);
    globalThis.gunzPacks = m ? [c, m] : [c];
    globalThis.gunzArgs = args;
    globalThis.gunzReady = () => {
     startItem.done(); $("loading").remove(); $("gunz").focus();
     if (map && touch) $("touch").classList.remove("off");
    };
    // a match: 4 = play again, anything else = back to this menu (as the desktop build
    // relaunches); the game's menu: its START left the match to play (`gunzPlay`)
    globalThis.gunzExit = code => {
     sessionStorage.setItem("gunzAgain", map && code === 4 ? "1" : "");
     location.reload();
    };
    globalThis.gunzPlay = (map, flags) => sessionStorage.setItem("gunzNext", JSON.stringify([map, ...flags]));
    if (map) sessionStorage.setItem("gunzLast", JSON.stringify(args));
    startItem.busy(map ? "reading data, building the map and the bots' paths (a few seconds)"
     : "reading the clothes catalogue");
    // let the browser paint that before the start-up takes the page's thread
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
    await mod.default({module_or_path: wasm});
   } catch (e) {
    // winit hands control to the browser's event loop by throwing; that is not a failure
    if (!String(e).includes("Using exceptions for control flow")) {
     $("now").textContent = String(e); $("now").classList.add("err"); throw e;
    }
   }
  }
  $("start").onclick = () => {
   const pick = {map: $("map").value, mode: $("mode").value, bots: $("bots").value};
   sessionStorage.setItem("gunz", JSON.stringify(pick));
   // sex and clothes come from the profile the game keeps in this browser
   launch([pick.map, "--mode", pick.mode, "--bots", String(pick.bots)], pick.map);
  };
  $("dress").onclick = () => launch(["--menu-page", "player", "--map", $("map").value]);
  const next = JSON.parse(sessionStorage.getItem("gunzNext") || "null");
  const last = JSON.parse(sessionStorage.getItem("gunzLast") || "null");
  sessionStorage.removeItem("gunzNext");
  if (next) launch(next, next[0]);
  else if (last && sessionStorage.getItem("gunzAgain")) {sessionStorage.removeItem("gunzAgain"); launch(last, last[0]);}
 </script>
</body>

</html>
